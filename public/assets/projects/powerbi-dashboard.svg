<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeloitte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgDeloitte)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="20" width="540" height="36" rx="6" fill="#121B2B" stroke="#263449"/>
  <circle cx="50" cy="38" r="5" fill="#10b981"/>
  <text x="65" y="42" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">DELOITTE FORENSIC &amp; OPERATIONAL ANALYTICS DASHBOARD</text>
  <text x="475" y="42" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="10">TABLEAU BI</text>

  <!-- Left: KPI Cards -->
  <g transform="translate(30, 70)">
    <!-- KPI 1 -->
    <rect width="165" height="70" rx="8" fill="#101624" stroke="#263449"/>
    <text x="15" y="24" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">DATASET RECORDS</text>
    <text x="15" y="52" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">128,450</text>
    <text x="110" y="52" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">CLEAN</text>

    <!-- KPI 2 -->
    <rect y="82" width="165" height="70" rx="8" fill="#101624" stroke="#263449"/>
    <text x="15" y="106" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">ANOMALIES FLAGGED</text>
    <text x="15" y="134" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">142</text>
    <text x="100" y="134" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">0.11%</text>

    <!-- KPI 3 -->
    <rect y="164" width="165" height="70" rx="8" fill="#101624" stroke="#263449"/>
    <text x="15" y="188" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">REVENUE IMPACT</text>
    <text x="15" y="216" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">$4.2M</text>
    <text x="105" y="216" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">AUDITED</text>
  </g>

  <!-- Right: Visual Charts -->
  <g transform="translate(210, 70)">
    <!-- Chart 1: Anomaly Frequency Histogram -->
    <rect width="360" height="110" rx="8" fill="#101624" stroke="#263449"/>
    <text x="15" y="24" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">VARIANCE &amp; DEVIATION DISTRIBUTION</text>
    <!-- Bars -->
    <g transform="translate(20, 35)">
      <rect x="0" y="45" width="22" height="25" rx="2" fill="#263449"/>
      <rect x="30" y="30" width="22" height="40" rx="2" fill="#263449"/>
      <rect x="60" y="15" width="22" height="55" rx="2" fill="#6366F1"/>
      <rect x="90" y="5" width="22" height="65" rx="2" fill="#00D4FF"/>
      <rect x="120" y="18" width="22" height="52" rx="2" fill="#00D4FF"/>
      <rect x="150" y="32" width="22" height="38" rx="2" fill="#6366F1"/>
      <rect x="180" y="48" width="22" height="22" rx="2" fill="#263449"/>
      <rect x="210" y="52" width="22" height="18" rx="2" fill="#263449"/>
      <rect x="240" y="10" width="22" height="60" rx="2" fill="#f43f5e"/>
      <text x="238" y="5" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9">SPIKE</text>
      <rect x="270" y="58" width="22" height="12" rx="2" fill="#263449"/>
    </g>

    <!-- Chart 2: Category Breakdown -->
    <rect y="124" width="360" height="110" rx="8" fill="#101624" stroke="#263449"/>
    <text x="15" y="146" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">AUDIT CLASSIFICATION BY OPERATIONAL STREAM</text>
    <!-- Horizontal Bars -->
    <g transform="translate(20, 155)">
      <text x="0" y="12" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="10">Reconciliations</text>
      <rect x="110" y="2" width="180" height="12" rx="2" fill="#00D4FF"/>
      <text x="298" y="12" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="10">99.4%</text>

      <text x="0" y="34" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="10">Trans Surveillance</text>
      <rect x="110" y="24" width="155" height="12" rx="2" fill="#6366F1"/>
      <text x="272" y="34" fill="#6366F1" font-family="'JetBrains Mono', monospace" font-size="10">94.8%</text>

      <text x="0" y="56" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="10">Exception Logs</text>
      <rect x="110" y="46" width="130" height="12" rx="2" fill="#10b981"/>
      <text x="248" y="56" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">88.2%</text>
    </g>
  </g>

  <!-- Bottom status line -->
  <text x="35" y="335" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">DELOITTE AUSTRALIA VIRTUAL EXPERIENCE · DATA FORENSICS &amp; VISUAL INSIGHTS</text>
</svg>
