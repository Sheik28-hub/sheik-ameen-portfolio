<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgRisk)"/>
  <!-- Grid Lines -->
  <g stroke="#1a273b" stroke-width="1" opacity="0.6">
    <line x1="40" y1="80" x2="560" y2="80"/>
    <line x1="40" y1="140" x2="560" y2="140"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="260" x2="560" y2="260"/>
    <line x1="120" y1="40" x2="120" y2="300"/>
    <line x1="220" y1="40" x2="220" y2="300"/>
    <line x1="320" y1="40" x2="320" y2="300"/>
    <line x1="420" y1="40" x2="420" y2="300"/>
    <line x1="520" y1="40" x2="520" y2="300"/>
  </g>
  <!-- Area fill under risk curve -->
  <path d="M 60 250 Q 140 230 200 160 T 320 180 T 420 110 T 540 80 L 540 280 L 60 280 Z" fill="#00D4FF" fill-opacity="0.08"/>
  <!-- Risk Trend Curve -->
  <path d="M 60 250 Q 140 230 200 160 T 320 180 T 420 110 T 540 80" fill="none" stroke="url(#cyanLine)" stroke-width="3.5"/>
  <!-- Threshold Line -->
  <line x1="60" y1="140" x2="540" y2="140" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
  <text x="440" y="132" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DEFAULT THRESHOLD</text>
  <!-- Points -->
  <circle cx="200" cy="160" r="5" fill="#00D4FF" stroke="#070A12" stroke-width="2"/>
  <circle cx="320" cy="180" r="5" fill="#00D4FF" stroke="#070A12" stroke-width="2"/>
  <circle cx="420" cy="110" r="5" fill="#f43f5e" stroke="#070A12" stroke-width="2"/>
  <circle cx="540" cy="80" r="5" fill="#10b981" stroke="#070A12" stroke-width="2"/>
  <!-- Metric Badges -->
  <rect x="40" y="32" width="130" height="34" rx="6" fill="#121B2B" stroke="#263449"/>
  <text x="52" y="53" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">ACCURACY GAIN</text>
  <text x="135" y="53" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">+15%</text>
  <rect x="180" y="32" width="150" height="34" rx="6" fill="#121B2B" stroke="#263449"/>
  <text x="192" y="53" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">DEFAULT PREDICTION</text>
  <text x="295" y="53" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">+18%</text>
  <rect x="340" y="32" width="150" height="34" rx="6" fill="#121B2B" stroke="#263449"/>
  <text x="352" y="53" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">SHRIRAM FINANCE</text>
  <text x="450" y="53" fill="#6366F1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">BFS</text>
  <!-- Bar chart overlay bottom right -->
  <g opacity="0.7">
    <rect x="360" y="210" width="22" height="70" rx="3" fill="#263449"/>
    <rect x="390" y="190" width="22" height="90" rx="3" fill="#263449"/>
    <rect x="420" y="160" width="22" height="120" rx="3" fill="#6366F1"/>
    <rect x="450" y="140" width="22" height="140" rx="3" fill="#00D4FF"/>
    <rect x="480" y="170" width="22" height="110" rx="3" fill="#10b981"/>
    <rect x="510" y="200" width="22" height="80" rx="3" fill="#263449"/>
  </g>
  <text x="50" y="320" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">MODEL: LOGISTIC REGRESSION · XGBOOST · SQL PIPELINE</text>
</svg>
